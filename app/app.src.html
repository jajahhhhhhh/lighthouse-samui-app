<style>
/* @FONTS@ */

:root{
  --shore:#F0FAE1; --mist:#E1EECC; --leaf:#CCDBB2; --sage:#AEBF92;
  --moss:#6B7A52; --fern:#4F5C3A; --pine:#3D472B; --palm:#272E1B;
  --clay:#C67139; --clay-500:#D9834A; --clay-100:#FDF3EC; --clay-700:#A85A2A;
  --paper:#F9F4ED; --n500:#9A958C; --n800:#2E2B25;
  --r-md:16px; --r-lg:28px; --r-pill:999px;
  --display:'Caprasimo',Georgia,serif;
  --ui:'Figtree','Noto Sans Thai',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --shadow:0 12px 32px rgba(39,46,27,.22);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--palm); color:var(--palm);
  font-family:var(--ui); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh; display:grid; place-items:center;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;
  cursor:pointer;text-align:inherit;font-family:var(--ui)}
:focus-visible{outline:2.5px solid var(--clay);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── shell ─────────────────────────────────────────────── */
.app{
  width:min(430px,100vw); height:min(880px,100dvh);
  background:var(--shore); border-radius:34px; overflow:hidden;
  display:flex; flex-direction:column; position:relative;
  box-shadow:var(--shadow),0 0 0 1px rgba(39,46,27,.14);
}
@media (max-width:470px){
  .app{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
}
.view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:26px 20px calc(20px + env(safe-area-inset-bottom))}
.view.dark{background:var(--palm)}
.view::-webkit-scrollbar{width:0}

/* ── type ──────────────────────────────────────────────── */
.d{font-family:var(--display);font-weight:400;line-height:1.08}
.h1{font-family:var(--display);font-size:28px;line-height:1.1;margin:0}
.kicker{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--fern);
  text-transform:uppercase}
.kicker.on-dark{color:var(--sage)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fern);font-size:13.5px}
.legal{font-size:12px;color:var(--fern);text-align:center;line-height:1.55;margin-top:12px}

/* ── atoms ─────────────────────────────────────────────── */
.stack{display:flex;flex-direction:column}
.row-g{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--sage);
  border-radius:var(--r-pill);padding:8px 15px;font-size:13.5px;font-weight:600;
  color:var(--pine);background:transparent;transition:background .12s,color .12s}
.pill[aria-pressed="true"]{background:var(--palm);border-color:var(--palm);color:var(--mist)}
.pill.tag{padding:6px 14px}
.pill.leaf{background:var(--leaf);border-color:var(--leaf);color:var(--palm)}
.btn{display:block;width:100%;text-align:center;border-radius:var(--r-pill);
  padding:15px 20px;font-weight:700;font-size:15.5px;transition:filter .12s}
.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--clay);color:var(--clay-100)}
.btn.solid{background:var(--mist);color:var(--palm)}
.btn.ghost{border:1.5px solid var(--sage);color:var(--palm);font-weight:600}
.btn.ghost.on-dark{border-color:var(--fern);color:var(--leaf)}
.card{background:var(--paper);border-radius:var(--r-lg);padding:18px 20px;width:100%;
  text-align:left;display:block}
.card.dark{background:var(--palm);color:var(--mist)}
.spec{display:flex;justify-content:space-between;align-items:center;gap:12px;
  border:1.5px solid var(--sage);border-radius:var(--r-pill);padding:12px 20px;width:100%}
.row{display:flex;gap:12px;align-items:center;background:var(--paper);
  border-radius:var(--r-md);padding:12px;width:100%;text-align:left}
.photo{background:repeating-linear-gradient(45deg,var(--mist),var(--mist) 6px,
  var(--shore) 6px,var(--shore) 12px);display:grid;place-items:center;flex:none;
  font-size:9px;letter-spacing:.5px;color:var(--moss);font-weight:600}
.plus{flex:none;width:36px;height:36px;border-radius:var(--r-pill);background:var(--palm);
  color:var(--mist);display:grid;place-items:center;font-weight:800;font-size:19px}
.step{width:32px;height:32px;border-radius:var(--r-pill);border:1.5px solid var(--sage);
  display:grid;place-items:center;font-weight:800;color:var(--palm);flex:none}
.price{font-family:var(--display);color:var(--clay-700)}

/* ── tab bar ───────────────────────────────────────────── */
.tabs[hidden]{display:none}   /* a class-level display:flex outranks [hidden] */
.tabs{flex:none;display:flex;justify-content:space-around;
  padding:9px 8px calc(6px + env(safe-area-inset-bottom));
  border-top:1.5px solid var(--leaf);background:var(--paper)}
.tab{position:relative;text-align:center;color:var(--n500);min-width:52px;padding:4px 6px;
  border-radius:12px}
.tab[aria-current="page"]{color:var(--palm)}
.tab .ic{font-size:17px;line-height:1.2}
.tab .lb{font-size:10.5px;font-weight:700;margin-top:1px}
.badge{position:absolute;top:-1px;right:4px;background:var(--clay);color:var(--clay-100);
  border-radius:var(--r-pill);min-width:17px;height:17px;font-size:11px;font-weight:800;
  display:grid;place-items:center;padding:0 4px}

/* ── gate ──────────────────────────────────────────────── */
.gate{min-height:100%;display:flex;flex-direction:column;justify-content:center;
  text-align:center;gap:0}
.mark{display:inline-flex;flex-direction:column;align-items:center}
.mark i{display:block;background:currentColor}
.mark .lamp{width:8px;height:8px;border-radius:50%}
.mark .top{width:21px;height:11px;border-radius:4px 4px 0 0;margin-top:2px}
.mark .tower{width:27px;height:35px;border-radius:0 0 5px 5px;
  clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
.mark .base{width:42px;height:6px;border-radius:3px;margin-top:2px}
.disc{width:96px;height:96px;border-radius:50%;background:var(--mist);color:var(--palm);
  display:grid;place-items:center;margin:0 auto}

.fade{animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

/* ── shell ─────────────────────────────────────────────── */
const VIEWS = {gate:vGate,home:vHome,menu:vMenu,detail:vDetail,bag:vBag,
               learn:vLearn,profile:vProfile,locator:vLocator};
const view = document.getElementById('view');
const tabs = document.getElementById('tabs');

function render(){
  const gate = S.view === 'gate';
  view.className = 'view fade' + (gate ? ' dark' : '');
  view.innerHTML = VIEWS[S.view]();
  view.scrollTop = 0;
  tabs.hidden = gate;
  if(!gate){
    const n = bagCount();
    const active = S.view === 'detail' ? 'menu' : S.view;
    tabs.innerHTML = TABS.map(([k,ic]) => `
      <button class="tab" data-act="tab" data-arg="${k}"
        ${active===k ? 'aria-current="page"' : ''}>
        <span class="ic" aria-hidden="true">${ic}</span>
        <span class="lb">${esc(t()[k==='bag'?'bagTab':k])}</span>
        ${k==='bag' && n ? `<span class="badge num">${n}</span>` : ''}
      </button>`).join('');
  }
  document.documentElement.lang = S.lang;
}

function addToBag(id){
  const hit = S.bag.find(b => b.id === id);
  if(hit) hit.qty++; else S.bag.push({id, qty:1});
  S.ordered = false;
}

document.querySelector('.app').addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act, arg = el.dataset.arg;
  const id = Number(arg);
  switch(act){
    case 'gate-yes': S.view = 'home'; S.denied = false; save(); break;
    case 'gate-no':  S.denied = true; break;
    case 'lang':     S.lang = arg; save(); break;
    case 'tab':      S.view = arg; break;
    case 'nav':      S.view = arg; break;
    case 'cat':      S.cat = arg; S.view = 'menu'; break;
    case 'filter':   S.filter = arg; S.cat = 'flower'; S.view = 'menu'; break;
    case 'open':     S.strain = id; S.view = 'detail'; break;
    case 'add':      addToBag(id); break;
    case 'add-open': addToBag(id); S.view = 'bag'; break;
    case 'inc':      addToBag(id); break;
    case 'dec': {
      const b = S.bag.find(x => x.id === id);
      if(b && --b.qty <= 0) S.bag = S.bag.filter(x => x.id !== id);
      break;
    }
    case 'place':
      S.code = 'LH-' + String(2000 + Math.floor(Math.random() * 900));
      S.ordered = true; S.bag = []; break;
    case 'reset': S.ordered = false; S.view = 'menu'; break;
    default: return;
  }
  render();
});

render();
</script>
