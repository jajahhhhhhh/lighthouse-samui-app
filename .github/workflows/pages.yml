name: Deploy to Pages

# The built app is gitignored, so it is built here rather than committed.
# node watch.mjs --once runs the same two builds the dev loop runs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build app and design system
        run: node watch.mjs --once

      - name: Assemble site
        run: |
          mkdir -p _site/design
          cp app/lighthouse-menu.html _site/index.html
          cp -R dist/. _site/design/
          echo 'menu.lighthousekohsamui.com' > _site/CNAME
          test -s _site/index.html
          echo "cards: $(find _site/design -name '*.html' | wc -l)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
